<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D05b · Gán nhãn thủ công</title>
<style>body{font:15px system-ui;margin:0;background:#f4f7f5;color:#173b29;padding:20px}main{max-width:1500px;margin:auto}h1{font-size:24px}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #bccfc3;border-radius:5px}button{background:#edf5ef;cursor:pointer}nav,.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:12px 0}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:20px}canvas{width:100%;touch-action:none;background:#ddd}section{min-width:0;background:white;padding:15px;border-radius:10px}.form{display:grid;gap:9px}.form label{display:grid;gap:4px}textarea{min-height:65px}img{max-width:100%;image-rendering:auto}pre{font:12px monospace;white-space:pre-wrap;overflow-wrap:anywhere}.notice{background:#fff2d0;padding:12px;border-radius:8px}.error{color:#a31919}#suggestions{max-height:150px;overflow:auto}@media(max-width:850px){body{padding:10px}.layout{grid-template-columns:1fr}}</style>
<main><h1>D05b · Ảnh gốc và nhãn thủ công</h1>
<p class="notice">Vẽ bbox trên ảnh gốc. Nội dung biển và khả năng đọc do người xem điền. Box nét đứt chỉ là gợi ý xe từ model. Không có OCR đề xuất trong biểu mẫu này. JSON tải xuống là nhãn riêng, ảnh gốc giữ nguyên.</p>
<nav><button id="prev">← Trước</button><select id="frame"></select><button id="next">Sau →</button><button id="review">Đánh dấu đã xem frame</button><button id="save">Tải nhãn JSON</button><button id="csv">Tải bảng CSV</button><label>Nạp JSON đã lưu <input id="load" type="file" accept=".json"></label></nav>
<p id="summary"></p><p id="message" class="error" role="status"></p>
<div class="row"><label>Biển trong toàn frame <select id="presence"><option value="unreviewed">Chưa xác nhận đầy đủ</option><option value="plate">Có biển — đã vẽ đủ mọi biển nhìn thấy</option><option value="no_plate">Đã kiểm tra — không có biển</option><option value="plate_unlocatable">Có biển nhưng chưa định vị/gán đầy đủ</option></select></label><label><input type="checkbox" id="complete"> Đã rà đầy đủ mọi biển trong frame</label></div>
<div class="layout"><section><div class="row"><label>Vẽ <select id="draw-kind"><option value="plate">Biển số</option><option value="vehicle">Xe</option><option value="hard_negative">Hard negative (khóa/thanh…)</option></select></label><label>Phóng ảnh <select id="zoom"><option value="fit">Vừa màn hình</option><option value="1">100% pixel gốc</option><option value="2">200% pixel gốc</option></select></label><button id="split-mode">Đặt đường tách hai dòng: bấm trên biển</button></div><div style="overflow:auto;max-height:75vh"><canvas id="canvas"></canvas></div><p id="source" style="overflow-wrap:anywhere"></p><details><summary>Gợi ý xe/crop từ detector — không phải nhãn</summary><pre id="suggestions"></pre></details></section>
<section><div class="form"><label>Bbox đang sửa <select id="annotation"></select></label><button id="delete">Xóa bbox đang chọn</button><label>Khả năng đọc <select id="readability"><option value="pending">Chưa gán</option><option value="readable">Đọc được toàn biển</option><option value="uncertain">Không chắc</option><option value="unreadable">Không đọc được</option></select></label><label>Nội dung biển thủ công (có thể xuống dòng)<textarea id="text" placeholder="Để trống nếu chưa đọc chắc; không chép dự đoán model"></textarea></label><label>Bố cục thực tế <select id="layout"><option value="pending">Chưa xác định</option><option value="single-line">Một dòng</option><option value="two-line">Hai dòng</option></select></label><label>Y đường tách hai dòng (pixel ảnh gốc)<input id="split-y" type="number"></label><label>Mã xe để chia tập (người gán)<input id="vehicle-group" placeholder="Cùng xe ở nhiều frame/video dùng cùng mã"></label><label>Mã lượt quay/capture group<input id="capture-group"></label><label>Tập dữ liệu <select id="split"><option value="unassigned">Chưa chia tập</option><option value="train">Train</option><option value="val">Validation</option><option value="test">Test</option></select></label><label>Ghi chú<input id="notes"></label></div><p id="crop-info"></p><img id="crop" alt="Crop bbox thủ công từ pixel gốc"><pre id="box"></pre></section></div></main>
<script>
const initial=__MANIFEST_JSON__;
let data=structuredClone(initial),index=0,active=-1,img=new Image(),drag=null,placingSplit=false;
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
function frame(){return data.frames[index]} function annotation(){return frame().annotations[active]}
function message(s){$('message').textContent=s}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(img.complete&&img.naturalWidth)ctx.drawImage(img,0,0);
 ctx.lineWidth=3;ctx.setLineDash([12,8]);ctx.strokeStyle='#1681b6';for(const s of frame().suggested_vehicles){const [x,y,r,b]=s.bbox;ctx.strokeRect(x,y,r-x,b-y)}ctx.setLineDash([]);
 ctx.setLineDash([7,5]);ctx.strokeStyle='#ff8c00';for(const s of (frame().suggested_plates||[])){const [x,y,r,b]=s.bbox;ctx.strokeRect(x,y,r-x,b-y)}ctx.setLineDash([]);
 frame().annotations.forEach((a,i)=>{ctx.strokeStyle=i===active?'#ff6022':a.kind==='plate'?'#0dbe65':'#9940dd';let [x,y,r,b]=a.bbox;ctx.strokeRect(x,y,r-x,b-y);if(a.split_y){ctx.beginPath();ctx.moveTo(x,a.split_y);ctx.lineTo(r,a.split_y);ctx.stroke()}});
 if(drag){ctx.strokeStyle='#ff6022';ctx.strokeRect(drag.x,drag.y,drag.endX-drag.x,drag.endY-drag.y)} }
function render(){const f=frame();$('frame').value=String(index);$('summary').textContent=`${index+1}/${data.frames.length} · Đã xem ${data.frames.filter(x=>x.reviewed).length} frame · ${f.reviewed?'Frame đã xem':'Frame chưa xem'}`;
 $('source').textContent=`${f.source_id} · media ${f.media_seconds.toFixed(3)} giây · frame ${f.frame_index} · ${f.width}×${f.height} pixel · ${data.sources.find(s=>s.source_id===f.source_id).path}`;
 $('suggestions').textContent=JSON.stringify({vehicles:f.suggested_vehicles,plate_proposals:f.suggested_plates??[]},null,2);$('capture-group').value=f.capture_group_id;$('split').value=f.split;$('presence').value=f.plate_presence??'unreviewed';$('complete').checked=f.annotations_complete===true;
 $('annotation').replaceChildren();f.annotations.forEach((a,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${a.kind} ${i+1} (${a.bbox.join(', ')})`;$('annotation').append(o)});
 if(active>=f.annotations.length)active=f.annotations.length-1;$('annotation').value=String(active);const a=annotation();
 for(const [id,key] of [['readability','readability'],['text','plate_text'],['layout','layout'],['split-y','split_y'],['vehicle-group','vehicle_group_id'],['notes','notes']])$(id).value=a?.[key]??(id==='readability'||id==='layout'?'pending':'');
 $('box').textContent=a?JSON.stringify(a,null,2):'Kéo trên ảnh để tạo bbox. Frame không có biển: xem kỹ rồi đánh dấu đã xem.';
 if(a&&img.complete&&img.naturalWidth){let [x,y,r,b]=a.bbox;let crop=document.createElement('canvas');crop.width=r-x;crop.height=b-y;crop.getContext('2d').drawImage(img,x,y,r-x,b-y,0,0,r-x,b-y);$('crop').src=crop.toDataURL('image/png');$('crop-info').textContent=`Crop gốc ${r-x}×${b-y}, không resize trong file nhãn.`}else{$('crop').removeAttribute('src');$('crop-info').textContent=''} draw();}
function loadFrame(){message('');active=-1;const f=frame();canvas.width=f.width;canvas.height=f.height;img=new Image();img.onload=render;img.onerror=()=>message('Không tải được ảnh gốc. Giữ label.html cạnh thư mục frames/.');img.src=f.image_path;render()}
function point(e){const r=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(canvas.width,Math.round((e.clientX-r.left)*canvas.width/r.width))),y:Math.max(0,Math.min(canvas.height,Math.round((e.clientY-r.top)*canvas.height/r.height)))}}
canvas.onpointerdown=e=>{let p=point(e);if(placingSplit){let a=annotation();if(a&&a.kind==='plate'&&a.bbox[1]<p.y&&p.y<a.bbox[3]){a.layout='two-line';a.split_y=p.y;frame().reviewed=false;frame().annotations_complete=false;render()}else message('Chọn bbox biển rồi bấm Y giữa hai dòng trong bbox.');placingSplit=false;return}drag={...p,endX:p.x,endY:p.y};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;let p=point(e);drag.endX=p.x;drag.endY=p.y;draw()};
canvas.onpointerup=e=>{if(!drag)return;let p=point(e),box=[Math.min(drag.x,p.x),Math.min(drag.y,p.y),Math.max(drag.x,p.x),Math.max(drag.y,p.y)];drag=null;if(box[2]-box[0]<2||box[3]-box[1]<2){draw();return}
 let f=frame();f.annotations.push({annotation_id:`${f.sample_id}-a${Date.now()}`,kind:$('draw-kind').value,bbox:box,readability:'pending',plate_text:'',layout:'pending',split_y:null,vehicle_group_id:'',label_origin:'manual_review',notes:''});active=f.annotations.length-1;f.reviewed=false;f.annotations_complete=false;render()};
for(const [id,key] of [['readability','readability'],['text','plate_text'],['layout','layout'],['split-y','split_y'],['vehicle-group','vehicle_group_id'],['notes','notes']])$(id).oninput=()=>{let a=annotation();if(!a)return;a[key]=id==='split-y'?($('split-y').value?Number($('split-y').value):null):$(id).value;frame().reviewed=false;frame().annotations_complete=false;$('box').textContent=JSON.stringify(a,null,2);$('summary').textContent=`${index+1}/${data.frames.length} · Đã xem ${data.frames.filter(x=>x.reviewed).length} frame · Frame chưa xem`;draw()};
$('capture-group').onchange=()=>{frame().capture_group_id=$('capture-group').value;render()};$('split').onchange=()=>{frame().split=$('split').value;render()};
$('presence').onchange=()=>{frame().plate_presence=$('presence').value;frame().annotations_complete=false;render()};
$('complete').onchange=()=>{const f=frame(),plates=f.annotations.filter(a=>a.kind==='plate');if($('complete').checked&&(!f.reviewed||!['plate','no_plate'].includes(f.plate_presence)||Boolean(plates.length)!==(f.plate_presence==='plate'))){$('complete').checked=false;message('Cần frame đã xem, xác nhận có/không có biển và bbox tương ứng trước khi xác nhận đủ nhãn.');return}f.annotations_complete=$('complete').checked;message('')};
$('annotation').onchange=()=>{active=Number($('annotation').value);render()};$('delete').onclick=()=>{if(active<0)return;frame().annotations.splice(active,1);active=-1;frame().reviewed=false;frame().annotations_complete=false;render()};
$('review').onclick=()=>{for(const a of frame().annotations){if(a.kind==='plate'&&a.readability==='readable'&&(!a.plate_text.trim()||a.layout==='pending'||(a.layout==='two-line'&&!(a.bbox[1]<a.split_y&&a.split_y<a.bbox[3])))){message('Biển đọc được cần nội dung, bố cục và đường tách hai dòng thực tế.');return}}frame().reviewed=!frame().reviewed;if(!frame().reviewed)frame().annotations_complete=false;data.label_origin='manual_review';message('');render()};
$('split-mode').onclick=()=>{placingSplit=true;message('Bấm vị trí giữa hai dòng trong bbox biển đang chọn.')};
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('save').onclick=()=>{data.label_origin='manual_review';if(data.frames.some(f=>typeof f.scene_hash!=='string')){message('scene_hash phải là chuỗi chính xác. Nạp lại nhãn qua trang đã sửa.');return}download('labels.manual.json',JSON.stringify(data,null,2),'application/json')};
$('csv').onclick=()=>{const fields=['sample_id','source_id','media_seconds','image_path','reviewed','annotation_id','kind','x1','y1','x2','y2','readability','plate_text','layout','split_y','vehicle_group_id','capture_group_id','split','notes'];let rows=[fields];for(const f of data.frames){for(const a of f.annotations.length?f.annotations:[{}]){let row={...f,...a};[row.x1,row.y1,row.x2,row.y2]=a.bbox??['','','',''];rows.push(fields.map(k=>row[k]??''))}}download('labels.manual.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')};
$('load').onchange=async()=>{try{const parsed=JSON.parse(await $('load').files[0].text());if(parsed.dataset_id!==initial.dataset_id)throw Error('JSON thuộc bộ ảnh khác');const hashes=new Map(initial.frames.map(f=>[f.sample_id,f.scene_hash]));if(parsed.frames.length!==hashes.size||new Set(parsed.frames.map(f=>f.sample_id)).size!==hashes.size)throw Error('Danh sách frame khác');for(const f of parsed.frames){if(typeof f.scene_hash!=='string'||f.scene_hash!==hashes.get(f.sample_id))throw Error('scene_hash không khớp chính xác. JSON cũ bị làm tròn cần import bằng công cụ Python, giữ bản gốc.')}data=parsed;index=0;loadFrame()}catch(e){message(e.message)}};
function change(n){index=Math.max(0,Math.min(data.frames.length-1,n));loadFrame()}
$('zoom').onchange=()=>{canvas.style.width=$('zoom').value==='fit'?'100%':`${canvas.width*Number($('zoom').value)}px`};
$('prev').onclick=()=>change(index-1);$('next').onclick=()=>change(index+1);$('frame').onchange=()=>change(Number($('frame').value));
initial.frames.forEach((f,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${f.sample_id} · ${f.media_seconds.toFixed(3)}s`;$('frame').append(o)});loadFrame();
</script></html>
