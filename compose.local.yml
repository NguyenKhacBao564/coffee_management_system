name: ${COMPOSE_PROJECT_NAME:-nhu-tung-demo}
services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nhutung}
      POSTGRES_USER: ${POSTGRES_USER:-nhutung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_LOCKOUT_ENABLED: ${LOGIN_LOCKOUT_ENABLED:-true}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      SCALE_INGESTION_MAX_FUTURE_SECONDS: ${SCALE_INGESTION_MAX_FUTURE_SECONDS:-300}
      SCALE_INGESTION_MAX_BODY_BYTES: ${SCALE_INGESTION_MAX_BODY_BYTES:-65536}
      PILOT_EVIDENCE_ROOT: /data/evidence
      PILOT_EVIDENCE_MAX_FILE_BYTES: ${PILOT_EVIDENCE_MAX_FILE_BYTES:-10485760}
      PILOT_EVIDENCE_QUOTA_PER_FACILITY_BYTES: ${PILOT_EVIDENCE_QUOTA_PER_FACILITY_BYTES:-5368709120}
      PILOT_EVIDENCE_RETENTION_DAYS: ${PILOT_EVIDENCE_RETENTION_DAYS:-30}
      PILOT_AI_MODE: ${PILOT_AI_MODE:-disabled}
      PILOT_AI_QUEUE_LIMIT: ${PILOT_AI_QUEUE_LIMIT:-20}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - pilot_evidence:/data/evidence
      - ./data/pilot/evidence/live:/data/evidence/live
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s

  pilot-ai-worker:
    profiles: ["pilot-mock"]
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PILOT_EVIDENCE_ROOT: /data/evidence
      PILOT_AI_MODE: ${PILOT_AI_MODE:-disabled}
    volumes:
      - pilot_evidence:/data/evidence
      - ./data/pilot/evidence/live:/data/evidence/live
    depends_on:
      db:
        condition: service_healthy
    command: [".venv/bin/python", "-m", "app.modules.vehicle_pilot.worker", "--loop"]
    restart: unless-stopped

  evidence-retention:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PILOT_EVIDENCE_ROOT: /data/evidence
      PILOT_EVIDENCE_RETENTION_DAYS: ${PILOT_EVIDENCE_RETENTION_DAYS:-30}
    volumes:
      - pilot_evidence:/data/evidence
      - ./data/pilot/evidence/live:/data/evidence/live
    depends_on:
      db:
        condition: service_healthy
    command: [".venv/bin/python", "-m", "app.modules.vehicle_pilot.retention", "--loop", "--interval-seconds", "3600"]
    restart: unless-stopped

volumes:
  postgres_data:
  pilot_evidence:
