[project]
name = "nhu-tung-demo-api"
version = "0.1.0"
description = "Local API foundation for the Nhu Tung trip and weighbridge demo"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "fastapi==0.118.2",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.37.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
